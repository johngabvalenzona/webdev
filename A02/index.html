<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savoré: Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css" />

</head>

<body>

  <div class="aura-bg">
    <div class="aura-layer-1" aria-hidden="true"></div>
    <div class="aura-layer-2" aria-hidden="true"></div>
    <div class="aura-layer-3" aria-hidden="true"></div>
    <div class="aura-layer-4" aria-hidden="true"></div>

    <div class="aura-content">

      <div class="container pt-4">
        <a href="https://johngabvalenzona.github.io/" class="btn btn-outline-dark btn-sm rounded-pill">
          &larr; Back
        </a>
      </div>

      <!-- Header -->
      <div class="container text-center py-4">
        <h1 class="brand-title mb-1">Savoré</h1>
        <p class="brand-subtitle mb-0">Good Food. Good Moments.</p>
      </div>

      <div class="container py-4">
        <div class="row g-4" id="parent">

        </div>
      </div>

    </div>
  </div>

    <!-- Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <img src="" class="modal-img" id="modalImage" alt="">
        <div class="modal-header border-0 pb-0">
          <h4 class="modal-title card-title" id="modalName"></h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <span class="badge rounded-pill category-badge" id="modalCategory"></span>
          </div>
          <p id="modalDescription"></p>
          <div class="price mb-3" id="modalPrice"></div>
          <div class="modal-details border-top pt-3">
            <div><strong>Serving size:</strong> <span id="modalServing"></span></div>
            <div><strong>Preparation time:</strong> <span id="modalPrep"></span></div>
            <div><strong>Availability:</strong> <span id="modalAvailability"></span></div>
            <div><strong>Dietary info:</strong> <span id="modalDietary"></span></div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-dark btn-sm rounded-pill" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var menu = [
      {
        name: "Garlic Parmesan Fries",
        image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80",
        category: "Appetizer",
        description: "Crispy golden fries tossed in roasted garlic butter and finished with shaved Parmesan.",
        price: 175,
        availability: "Available",
        servingSize: "Good for 2 to 3",
        preparationTime: "10-12 minutes",
        dietaryInfo: "Vegetarian, contains dairy"
      },
      {
        name: "Creamy Mushroom Pasta",
        image: "https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?auto=format&fit=crop&w=600&q=80",
        category: "Pasta",
        description: "Creamy garlic sauce tossed with sautéed mushrooms and Parmesan cheese.",
        price: 285,
        availability: "Available",
        servingSize: "1 serving",
        preparationTime: "15-20 minutes",
        dietaryInfo: "Vegetarian, contains dairy and gluten"
      },
      {
        name: "Grilled Chicken with Herb Rice",
        image: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=600&q=80",
        category: "Rice Meal",
        description: "Juicy herb-marinated chicken breast served over fragrant garlic herb rice with a light pan sauce.",
        price: 320,
        availability: "Available",
        servingSize: "1 serving",
        preparationTime: "20-25 minutes",
        dietaryInfo: "Contains poultry, no dairy"
      },
      {
        name: "Beef Steak with Mashed Potatoes",
        image: "https://images.unsplash.com/photo-1546964124-0cce460f38ef?auto=format&fit=crop&w=600&q=80",
        category: "Main Course",
        description: "Tender grilled beef steak with buttery mashed potatoes and a rich red wine reduction.",
        price: 595,
        availability: "Available",
        servingSize: "250 g steak",
        preparationTime: "25-30 minutes",
        dietaryInfo: "Contains beef and dairy"
      },
      {
        name: "Margherita Pizza",
        image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=600&q=80",
        category: "Pizza",
        description: "Hand-stretched crust with San Marzano tomato sauce, fresh mozzarella, and basil.",
        price: 380,
        availability: "Sold Out",
        servingSize: "10-inch, 6 slices",
        preparationTime: "18-22 minutes",
        dietaryInfo: "Vegetarian, contains dairy and gluten"
      },
      {
        name: "Classic Cheesecake",
        image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80",
        category: "Dessert",
        description: "Smooth baked cheesecake on a buttery graham crust, topped with a strawberry compote.",
        price: 195,
        availability: "Available",
        servingSize: "1 slice",
        preparationTime: "5 minutes",
        dietaryInfo: "Vegetarian, contains dairy, eggs and gluten"
      },
      {
        name: "Iced Spanish Latte",
        image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80",
        category: "Beverage",
        description: "Double espresso shaken with sweetened milk over ice for a smooth, creamy finish.",
        price: 165,
        availability: "Available",
        servingSize: "16 oz",
        preparationTime: "5 minutes",
        dietaryInfo: "Contains dairy and caffeine"
      },
      {
        name: "Fresh Lemonade",
        image: "https://images.unsplash.com/photo-1656936632107-0bfa69ea06de?auto=format&fit=crop&w=600&q=80",
        category: "Beverage",
        description: "Freshly squeezed lemons with a touch of cane sugar, served over ice with mint.",
        price: 120,
        availability: "Available",
        servingSize: "16 oz",
        preparationTime: "3-5 minutes",
        dietaryInfo: "Vegan, dairy-free, gluten-free"
      }
    ];

    var parent = document.getElementById("parent");

    for (var i = 0; i < menu.length; i++) {
      parent.innerHTML += `
        <div class="col-12 col-sm-6 col-md-6 col-lg-4 col-xl-3 col-xxl-3">
          <div class="card h-100 border border-1" data-bs-toggle="modal" data-bs-target="#detailsModal" onclick="showDetails(${i})">
            <img src="${menu[i].image}" class="card-img-top" alt="${menu[i].name}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title mb-1">${menu[i].name}</h5>
              <div class="mb-2">
                <span class="badge rounded-pill category-badge">${menu[i].category}</span>
              </div>
              <p class="card-text short-description">${menu[i].description}</p>
              <div class="price mt-auto">₱${menu[i].price}</div>
            </div>
          </div>
        </div>
      `;
    }

    function showDetails(index) {
      document.getElementById("modalImage").src = menu[index].image;
      document.getElementById("modalImage").alt = menu[index].name;
      document.getElementById("modalName").innerHTML = menu[index].name;
      document.getElementById("modalCategory").innerHTML = menu[index].category;
      document.getElementById("modalDescription").innerHTML = menu[index].description;
      document.getElementById("modalPrice").innerHTML = "₱" + menu[index].price;
      document.getElementById("modalServing").innerHTML = menu[index].servingSize;
      document.getElementById("modalPrep").innerHTML = menu[index].preparationTime;
      document.getElementById("modalAvailability").innerHTML = menu[index].availability;
      document.getElementById("modalDietary").innerHTML = menu[index].dietaryInfo;
    }
  </script>
</body>

</html>
