<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHINOBI ARCHIVES – Characters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <nav class="site-nav py-2">
    <div class="container">
      <a class="brand" href="index.html">忍 SHINOBI <span>ARCHIVES</span></a>
    </div>
  </nav>

  <main class="container mt-4">
    <div id="message"></div>

    <!-- Village directory -->
    <section id="directory" style="display:none">
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Villages</a></li>
          <li class="breadcrumb-item active" id="crumbName"></li>
        </ol>
      </nav>
      <h1 id="villageName"></h1>
      <input type="text" id="searchInput" class="form-control my-3" placeholder="Search characters by name...">
      <div id="characterList"></div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <button class="btn btn-red" id="prevBtn" onclick="prev()">Previous</button>
        <span id="pageInfo"></span>
        <button class="btn btn-red" id="nextBtn" onclick="next()">Next</button>
      </div>
    </section>

    <!-- Character profile -->
    <section id="profile" style="display:none"></section>
  </main>

  <footer class="text-center">Data from the Dattebayo API</footer>

  <script src="assets/filter.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const villageId = params.get("village");
    const charId = params.get("id");

    let village = null;
    let eligibleChars = {};
    let page = 1;
    const perPage = 10;
    let searchTerm = "";
    let matches = [];

    function text(value) {
      if (value === undefined || value === null || value === "") return "";
      if (Array.isArray(value)) {
        const parts = [];
        for (let i = 0; i < value.length; i++) {
          const t = text(value[i]);
          if (t !== "") parts.push(t);
        }
        return parts.join(", ");
      }
      if (typeof value === "object") {
        const parts = [];
        for (const key in value) {
          const t = text(value[key]);
          if (t !== "") parts.push(key + ": " + t);
        }
        return parts.join("; ");
      }
      return String(value).replace("File:Gender Various.svg", "").trim();
    }

    function unwrap(data, listName) {
      if (data[listName] && data[listName].length > 0) return data[listName][0];
      return data;
    }

    function backLink() {
      return villageId !== null ? "view.html?village=" + villageId : "index.html";
    }

    // ---------- Village directory ----------
    async function getVillage(data) {
      for (let i = 0; i < data.villages.length; i++) {
        if (String(data.villages[i].id) === villageId) village = data.villages[i];
      }
      if (village === null) throw new Error("village not eligible");
      document.getElementById("villageName").innerHTML = village.name;
      document.getElementById("crumbName").innerHTML = village.name;
      document.title = village.name + " – SHINOBI ARCHIVES";
    }

    async function getOneCharacter(id) {
      try {
        const response = await fetch(API + "/characters/" + id);
        return unwrap(await response.json(), "characters");
      } catch (error) {
        return null;
      }
    }

    async function getCharacters() {
      const list = document.getElementById("characterList");
      list.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-danger"></div></div>';
      try {
        let chars = [];
        let total = 0;
        if (searchTerm === "") {
          total = village.characters.length;
          const ids = village.characters.slice((page - 1) * perPage, page * perPage);
          for (let i = 0; i < ids.length; i++) {
            chars.push(eligibleChars[ids[i]]);
          }
        } else {
          total = matches.length;
          chars = matches.slice((page - 1) * perPage, page * perPage);
        }
        showCharacters(chars, total);
      } catch (error) {
        list.innerHTML = '<div class="alert alert-danger">Could not load the characters. Please try again.</div>';
      }
    }

    function showCharacters(chars, total) {
      let html = "";
      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        const p = c.personal || {};
        const rank = c.rank && c.rank.ninjaRank ? text(c.rank.ninjaRank) : "";
        const info = [];
        if (text(p.clan) !== "") info.push("Clan: " + text(p.clan));
        if (text(p.classification) !== "") info.push(text(p.classification));
        if (rank !== "") info.push("Rank: " + rank);
        const image = '<img src="' + c.images[0] + '" alt="' + c.name + '">';
        html += `
          <a class="char-row" href="view.html?id=${c.id}&village=${villageId}">
            ${image}
            <div>
              <div class="char-name">${c.name}</div>
              <div class="char-info">${info.join(" · ")}</div>
            </div>
          </a>`;
      }
      if (total === 0) {
        html = '<p class="text-center my-4">No characters match your search.</p>';
      }
      document.getElementById("characterList").innerHTML = html;

      const totalPages = Math.max(1, Math.ceil(total / perPage));
      document.getElementById("pageInfo").innerHTML = "Page " + page + " of " + totalPages + " (" + total + " characters)";
      document.getElementById("prevBtn").disabled = page <= 1;
      document.getElementById("nextBtn").disabled = page >= totalPages;
    }

    function prev() {
      if (page > 1) {
        page--;
        getCharacters();
        window.scrollTo(0, 0);
      }
    }

    function next() {
      page++;
      getCharacters();
      window.scrollTo(0, 0);
    }

    async function searchCharacters() {
      searchTerm = document.getElementById("searchInput").value.trim();
      page = 1;
      if (searchTerm === "") {
        getCharacters();
        return;
      }
      document.getElementById("characterList").innerHTML =
        '<div class="text-center my-5"><div class="spinner-border text-danger"></div></div>';
      try {
        matches = [];
        for (let i = 0; i < village.characters.length; i++) {
          const c = eligibleChars[village.characters[i]];
          if (c.name.toLowerCase().includes(searchTerm.toLowerCase())) {
            matches.push(c);
          }
        }
        getCharacters();
      } catch (error) {
        document.getElementById("characterList").innerHTML =
          '<div class="alert alert-danger">Search failed. Please try again.</div>';
      }
    }

    // ---------- Character profile ----------
    function makeSection(title, rows) {
      let items = "";
      for (let i = 0; i < rows.length; i++) {
        const value = text(rows[i][1]);
        if (value !== "") {
          items += "<dt>" + rows[i][0] + "</dt><dd>" + value + "</dd>";
        }
      }
      if (items === "") return "";
      return '<div class="profile-section"><h3>' + title + "</h3><dl class=\"mb-0\">" + items + "</dl></div>";
    }

    function makeTags(title, list) {
      if (!Array.isArray(list) || list.length === 0) return "";
      let tags = "";
      for (let i = 0; i < list.length; i++) {
        tags += '<span class="tag">' + list[i] + "</span>";
      }
      return '<div class="profile-section"><h3>' + title + "</h3>" + tags + "</div>";
    }

    async function getProfile() {
      if (!eligibleChars[charId]) throw new Error("character not eligible");
      const c = await getOneCharacter(charId);
      if (c === null || !c.name) throw new Error("not found");
      const p = c.personal || {};
      const r = c.rank || {};
      const v = c.voiceActors || {};

      const familyRows = [];
      for (const key in c.family || {}) {
        familyRows.push([key.trim().charAt(0).toUpperCase() + key.trim().slice(1), c.family[key]]);
      }

      const image = '<img class="profile-img" src="' + eligibleChars[charId].images[0] + '" alt="' + c.name + '">';

      document.title = c.name + " – SHINOBI ARCHIVES";
      document.getElementById("profile").innerHTML = `
        <a class="btn btn-red mb-3" href="${backLink()}">&larr; Back to Village</a>
        <div class="row g-4">
          <div class="col-md-5">${image}</div>
          <div class="col-md-7">
            <h1>${c.name} <span class="id-badge">ID ${c.id}</span></h1>
            ${makeSection("Personal Information", [
              ["Birthdate", p.birthdate], ["Sex", p.sex], ["Status", p.status], ["Blood Type", p.bloodType],
              ["Age", p.age], ["Height", p.height], ["Weight", p.weight], ["Species", p.species],
              ["Classification", p.classification], ["Occupation", p.occupation]
            ])}
            ${makeSection("Clan & Affiliation", [
              ["Clan", p.clan], ["Affiliation", p.affiliation], ["Team", p.team], ["Partner", p.partner]
            ])}
            ${makeSection("Ninja Info", [
              ["Ninja Rank", r.ninjaRank], ["Registration", r.ninjaRegistration], ["Kekkei Genkai", p.kekkeiGenkai],
              ["Tailed Beast", p.tailedBeast], ["Chakra Nature", c.natureType]
            ])}
            ${makeSection("Family", familyRows)}
            ${makeSection("Voice Actors", [["Japanese", v.japanese], ["English", v.english]])}
          </div>
        </div>
        <div class="mt-3">
          ${makeTags("Jutsu", c.jutsu)}
          ${makeTags("Tools", c.tools)}
        </div>`;
    }

    // ---------- Start the page ----------
    async function start() {
      const message = document.getElementById("message");
      showProgress("Loading...");
      try {
        const data = await loadEligibleData(showProgress);
        eligibleChars = data.characters;
        if (charId !== null) {
          await getProfile();
          document.getElementById("profile").style.display = "block";
        } else if (villageId !== null) {
          await getVillage(data);
          document.getElementById("directory").style.display = "block";
          document.getElementById("searchInput").addEventListener("input", searchCharacters);
          getCharacters();
        } else {
          message.innerHTML = '<div class="alert alert-warning">No village selected. <a href="index.html">Go back to the villages.</a></div>';
          return;
        }
        message.innerHTML = "";
      } catch (error) {
        message.innerHTML = '<div class="alert alert-danger">Sorry, this page could not be loaded. <a href="' + backLink() + '">Go back</a></div>';
      }
    }

    start();
  </script>
</body>
</html>
