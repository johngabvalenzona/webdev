<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Moodboard</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <div class="aura-bg">
    <div class="aura-layer aura-layer-1" aria-hidden="true"></div>
    <div class="aura-layer aura-layer-2" aria-hidden="true"></div>
    <div class="aura-layer aura-layer-3" aria-hidden="true"></div>
    <div class="aura-layer aura-layer-4" aria-hidden="true"></div>

    <div class="container-fluid mx-auto position-relative z-1 p-3">

      <!-- Row 1 -->
      <div class="row">
        <div class="col-12 col-lg-4 p-2 p-md-3">
          <div class="card title-card h-100 rounded-5 overflow-hidden p-4 gap-4 justify-content-between">
            <h1>Places I've been, and where next</h1>
            <div class="meta">
              <div>Gabriel Valenzona</div>
              <div class="legend">
                <span><i class="dot been"></i>Been there</span>
                <span><i class="dot want"></i>Want to go</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-7 col-lg-5 p-2 p-md-3">
          <div class="card photo tall g1 h-100 rounded-5 overflow-hidden">
            <img  src="assets/img/ilocos.jpg" alt="Ilocos">
            <span class="tag"><i class="dot been"></i>Ilocos</span>
          </div>
        </div>
        <div class="col-12 col-md-5 col-lg-3 p-2 p-md-3">
          <div class="card photo tall g2 h-100 rounded-5 overflow-hidden">
            <img  src="assets/img/mtulap.jpg" alt="Benguet">
            <span class="tag"><i class="dot been"></i>Mt. Ulap, Benguet</span>
          </div>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="row">
        <div class="col-12 col-md-5 col-lg-3 p-2 p-md-3">
          <div class="card photo g3 h-100 rounded-5 overflow-hidden">
            <img  src="assets/img/bohol.jpg" alt="Bohol">
            <span class="tag"><i class="dot want"></i>Bohol</span>
          </div>
        </div>
        <div class="col-12 col-md-7 col-lg-5 p-2 p-md-3">
          <div class="card photo g4 h-100 rounded-5 overflow-hidden">
            <img  src="assets/img/norway.jpg" alt="Norway">
            <span class="tag"><i class="dot want"></i>Tromsø, Norway</span>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="row">
            <div class="col-12 col-md-6 col-lg-12 p-2 p-md-3">
              <div class="card photo g5 rounded-5 overflow-hidden">
                <img  src="assets/img/gwoc.jpg" alt="Great Wall of China">
                <span class="tag"><i class="dot want"></i>Great Wall of China</span>
              </div>
            </div>
            <div class="col-12 col-md-6 col-lg-12 p-2 p-md-3">
              <div class="card photo g6 rounded-5 overflow-hidden">
                <img  src="assets/img/pgallera.jpg" alt="Mindoro">
                <span class="tag"><i class="dot been"></i>Oriental Mindoro</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Back button -->
      <div class="text-center pt-3 pb-2">
        <a class="back-btn" href="https://johngabvalenzona.github.io/"><span aria-hidden="true">&larr;</span> Back</a>
      </div>

    </div>
  </div><!-- /.aura-bg -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
